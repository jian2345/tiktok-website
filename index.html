<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download IG & Tiktok Keren</title>
  <style>
    body {
      background: linear-gradient(45deg, #8E2DE2, #4A00E0);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 40px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }
    .box {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      margin: 20px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
    }
    input {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border: none;
      border-radius: 50px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }
    input:focus {
      background: rgba(255,255,255,0.3);
      transform: scale(1.02);
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      margin: 10px 5px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      z-index: 1;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      color: white;
      text-decoration: none;
    }
    .btn--ig {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .btn--tiktok {
      background: #000;
    }
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background: rgba(255,255,255,0.3);
      transition: all 0.4s;
      z-index: -1;
    }
    .btn:hover:before {
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .result {
      margin-top: 20px;
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
    }
    .media {
      width: 100%;
      max-height: 300px;
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    a.download {
      display: inline-block;
      padding: 10px 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 50px;
      margin: 5px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s;
    }
    a.download:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Download IG & Tiktok</h1>
    <input type="text" id="url" placeholder="Masukkan link IG Reels/Story atau Tiktok" />
    <button class="btn btn--ig" onclick="download('ig')">Download Instagram</button>
    <button class="btn btn--tiktok" onclick="download('tiktok')">Download Tiktok</button>
    <div id="result" class="result"></div>
  </div>

  <script>
    async function download(platform) {
      const urlInput = document.getElementById('url');
      const result = document.getElementById('result');
      const url = urlInput.value.trim();

      if (!url) {
        result.textContent = '❌ Silakan masukkan link terlebih dahulu!';
        return;
      }

      result.innerHTML = '⏳ Sedang memproses...';

      let api = '';
      if (platform === 'ig') {
        api = `https://api.siputzx.my.id/api/d/igdl?url=${encodeURIComponent(url)}`;
      } else if (platform === 'tiktok') {
        api = `https://api.vreden.my.id/api/tiktok?url=${encodeURIComponent(url)}`;
      }

      try {
        const response = await fetch(api);
        const data = await response.json();
        result.innerHTML = '';

        let mediaList = [];

        if (platform === 'tiktok' && data?.result?.data) {
          mediaList = data.result.data.map(d => d.url);
          if (data.result.music_info?.url) {
            mediaList.push(data.result.music_info.url); // Tambah musik jika ada
          }

          // Info tambahan (opsional)
          result.innerHTML += `
            <p><strong>🎥 Judul:</strong> ${data.result.title}</p>
            <p><strong>🕒 Durasi:</strong> ${data.result.duration}</p>
            <p><strong>👤 Author:</strong> ${data.result.author.nickname}</p>
            <img src="${data.result.cover}" alt="Thumbnail" class="media">
          `;
        } else if (data.result && Array.isArray(data.result)) {
          mediaList = data.result;
        } else if (data.media) {
          mediaList = Array.isArray(data.media) ? data.media : [data.media];
        } else if (data.url) {
          mediaList = [data.url];
        }

        if (mediaList.length === 0) {
          result.innerHTML = '<span>⚠ Tidak ditemukan media. Cek link!</span>';
          console.log(data);
          return;
        }

        mediaList.forEach(item => {
          let mediaUrl = typeof item === 'string' ? item : item.url;
          if (!mediaUrl) return;

          if (mediaUrl.includes('.mp4')) {
            result.innerHTML += `
              <video class="media" controls>
                <source src="${mediaUrl}" type="video/mp4">
              </video>
              <a href="${mediaUrl}" download class="download">Download Video</a><br><br>
            `;
          } else if (mediaUrl.includes('.mp3')) {
            result.innerHTML += `
              <audio class="media" controls>
                <source src="${mediaUrl}" type="audio/mpeg">
              </audio>
              <a href="${mediaUrl}" download class="download">Download Audio</a><br><br>
            `;
          } else if (mediaUrl.match(/\.(jpg|jpeg|png|webp)/)) {
            result.innerHTML += `
              <img class="media" src="${mediaUrl}" />
              <a href="${mediaUrl}" download class="download">Download Gambar</a><br><br>
            `;
          } else {
            result.innerHTML += `
              <a href="${mediaUrl}" target="_blank" class="download">Buka Media</a><br><br>
            `;
          }
        });
      } catch (err) {
        console.error(err);
        result.innerHTML = '❌ Gagal memuat media. API sedang error atau jaringan bermasalah.';
      }
    }
  </script>
</body>
</html>
